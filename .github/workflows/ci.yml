name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Weekly scan of main between Dependabot's monthly runs: vulnerabilities and codeql only.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew assembleDebug --console=plain
      - run: scripts/check-debug-signing.sh

  unit:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew testDebugUnitTest --console=plain
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: unit-test-reports
          path: app/build/reports/tests

  lint:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew lintDebug --console=plain
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*

  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: java-kotlin
          build-mode: manual
          config-file: .github/codeql/codeql-config.yml
      - run: ./gradlew --no-daemon assembleDebug --console=plain
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          upload: never
          output: sarif
      - run: scripts/codeql-findings.sh sarif/*.sarif

  vulnerabilities:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker://ghcr.io/google/osv-scanner:v2.7.1@sha256:a70ffffc2bfd33482953e5d6b64c6fcdb30239717a07b0f0d3ab2859ce3e4cde
        with:
          args: scan source --lockfile app/gradle.lockfile

  emulator:
    strategy:
      fail-fast: false
      matrix:
        variant: [base, emu37213, clt22, both]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: free disk for the emulator's userdata image
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: experiment variant
        run: |
          set -euo pipefail
          sdk=$ANDROID_HOME
          if [[ ${{ matrix.variant }} == emu37213 || ${{ matrix.variant }} == both ]]; then
            curl -fsSL -o "$RUNNER_TEMP/emu.zip" https://dl.google.com/android/repository/emulator-linux_x64-16740729.zip
            echo "cbc7c3cfb83220b8a0f9c513fdab557712e74d339ec19ddffa43f23350ae9bdd  $RUNNER_TEMP/emu.zip" | sha256sum -c
            sudo rm -rf "$sdk/emulator"; unzip -q "$RUNNER_TEMP/emu.zip" -d "$sdk"
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' \
              '<ns2:repository xmlns:ns2="http://schemas.android.com/repository/android/common/02" xmlns:ns5="http://schemas.android.com/repository/android/generic/02" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">' \
              '<localPackage path="emulator" obsolete="false"><type-details xsi:type="ns5:genericDetailsType"/><revision><major>37</major><minor>2</minor><micro>13</micro></revision><display-name>Android Emulator</display-name></localPackage>' \
              '</ns2:repository>' > "$sdk/emulator/package.xml"
          fi
          if [[ ${{ matrix.variant }} == clt22 || ${{ matrix.variant }} == both ]]; then
            curl -fsSL -o "$RUNNER_TEMP/clt.zip" https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
            echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $RUNNER_TEMP/clt.zip" | sha256sum -c
            sudo rm -rf "$sdk/cmdline-tools/latest"; unzip -q "$RUNNER_TEMP/clt.zip" -d "$RUNNER_TEMP/clt"; sudo mv "$RUNNER_TEMP/clt/cmdline-tools" "$sdk/cmdline-tools/latest"
          fi
          ls "$sdk" "$sdk/cmdline-tools"
          [[ ! -x $sdk/emulator/emulator ]] || "$sdk/emulator/emulator" -version | head -1
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --version
      - name: boot an emulator, run the instrumented tests and the e2e
        run: scripts/emulator.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: emulator-diagnostics-${{ matrix.variant }}
          path: |
            app/build/emulator-diagnostics
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
